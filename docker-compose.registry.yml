services:
  mysql:
    image: mysql:8.4
    container_name: workhub-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - workhub_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: workhub-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ""
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    image: ghcr.io/sahlihamza/workhub-sofia-backend:latest
    container_name: workhub-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ""
      DB_DATABASE: ${MYSQL_DATABASE}
      PORT: 3000
      FRONTEND_URL: http://localhost:4201
      RUN_SEED_ON_START: "true"
    ports:
      - "3001:3000"
    volumes:
      - workhub_backend_data:/var/lib/workhub
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: ghcr.io/sahlihamza/workhub-sofia-frontend:latest
    container_name: workhub-frontend
    restart: unless-stopped
    ports:
      - "4201:80"
    depends_on:
      - backend

volumes:
  workhub_backend_data:
  workhub_mysql_data:
