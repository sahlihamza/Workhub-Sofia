name: CI/CD Docker images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/sahlihamza

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Compose validation environment
        run: |
          printf 'MYSQL_ROOT_PASSWORD=\nMYSQL_DATABASE=WorkHubSofia\nMYSQL_USER=\nMYSQL_PASSWORD=\n' > .env

      - name: Validate Compose files
        run: docker compose -f docker-compose.registry.yml config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Work-Hub-Sofia-Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Work-Hub-Sofia-Backend
        run: npm ci

      - name: Build backend
        working-directory: Work-Hub-Sofia-Backend
        run: npm run build

  publish:
    name: Build and publish Docker images
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Work-Hub-Sofia-Backend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/workhub-sofia-backend:latest
            ${{ env.IMAGE_NAMESPACE }}/workhub-sofia-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Work-Hub-Sofia_Frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/workhub-sofia-frontend:latest
            ${{ env.IMAGE_NAMESPACE }}/workhub-sofia-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
