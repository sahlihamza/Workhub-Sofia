<div class="header bg-primary py-6 py-lg-5 d-flex align-items-center justify-content-between">
  <div class="container"></div>
  <div class="separator separator-bottom separator-skew zindex-100">
    <svg x="0" y="0" viewBox="0 0 2560 100" preserveAspectRatio="none" version="1.1" xmlns="http://www.w3.org/2000/svg">
      <polygon class="fill-default" points="2560 0 2560 100 0 100"></polygon>
    </svg>
  </div>
</div>

<!-- Page content -->
<div class="container mt--20 pb-1">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card bg-secondary shadow border-0">
        <div class="card-body px-lg-5 py-lg-2">
          <div class="row justify-content-center">
            <img src="./assets/img/brand/ST2.png" style="max-height: 150px;" class="logo-img" alt="Logo">
          </div>

          <!-- Message d'erreur backend -->
          <div *ngIf="messageErreur" class="alert alert-danger text-center mt-3">
            {{ messageErreur }}
          </div>

          <form role="form">
            <!-- Email -->
<div class="form-group mb-3">
  <div class="input-group input-group-alternative">
    <div class="input-group-prepend">
      <span class="input-group-text"><i class="ni ni-email-83"></i></span>
    </div>
    <input class="form-control" placeholder="Email" type="email" [(ngModel)]="email" name="email">
  </div>
  <div *ngIf="emailError" style="color:red; font-size:0.85em; margin-top:4px;">
    {{ emailError }}
  </div>
</div>

<!-- Mot de passe -->
<div class="form-group">
  <div class="input-group input-group-alternative">
    <div class="input-group-prepend">
      <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
    </div>
    <input class="form-control" placeholder="Password" type="password" [(ngModel)]="motDePasse" name="password">
  </div>
  <div *ngIf="passwordError" style="color:red; font-size:0.85em; margin-top:4px;">
    {{ passwordError }}
  </div>
</div>


            <div class="custom-control custom-control-alternative custom-checkbox">
              <input class="custom-control-input" id="customCheckLogin" type="checkbox">
              <label class="custom-control-label" for="customCheckLogin">
                <span class="text-muted">Remember me</span>
              </label>
            </div>

            <div class="text-center">
              <button type="button" class="btn btn-primary my-4" (click)="login()">Sign in</button>
            </div>
          </form>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-6">
  <a [routerLink]="['/reset-password']" class="text-light"><small>Forgot password?</small></a>
</div>

      </div>
    </div>
  </div>
</div>
