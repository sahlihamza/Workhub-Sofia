<!-- Header similaire au login -->
<div class="header bg-primary py-6 py-lg-5 d-flex align-items-center justify-content-between"
     style="min-height: 200px; background-image: url(assets/img/theme/ST.png); background-size: cover; background-position: center top;">
  <span class="mask bg-primary opacity-8"></span>
  <div class="container">
    <h1 class="text-white">Modifier le mot de passe</h1>
  </div>
  <div class="separator separator-bottom separator-skew zindex-100">
    <svg x="0" y="0" viewBox="0 0 2560 100" preserveAspectRatio="none" version="1.1"
         xmlns="http://www.w3.org/2000/svg">
      <polygon class="fill-default" points="2560 0 2560 100 0 100"></polygon>
    </svg>
  </div>
</div>

<!-- Corps de la page : formulaire inchangé -->
<div class="container-fluid d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="row w-100">
    <div class="col-xl-12 order-xl-1">
      <div class="card bg-secondary shadow">
        <div class="card-header bg-white border-0">
          <div class="row align-items-center">
            <div class="col-8">
              <h3 class="mb-0">Modifier le mot de passe</h3>
            </div>
            <div class="col-4 text-right"></div>
          </div>
        </div>
        <div class="card-body">
          <form (ngSubmit)="updatePassword(passwordForm)" #passwordForm="ngForm">
            <div class="pl-lg-4">
              <div class="row">
                <!-- Ancien mot de passe -->
                <div class="col-lg-6">
                  <div class="form-group">
                    <label for="ancienMotDePasse" class="form-control-label">Ancien mot de passe</label>
                    <input
                      type="password"
                      id="ancienMotDePasse"
                      name="ancienMotDePasse"
                      class="form-control form-control-alternative"
                      [(ngModel)]="ancienMotDePasse"
                      required
                      minlength="8"
                      #ancienMotDePasseInput="ngModel"
                    />
                    <div *ngIf="ancienMotDePasseInput.invalid && (ancienMotDePasseInput.dirty || ancienMotDePasseInput.touched)" style="color:red; font-size:0.85em;">
                      <div *ngIf="ancienMotDePasseInput.errors?.['required']">L'ancien mot de passe est requis.</div>
                      <div *ngIf="ancienMotDePasseInput.errors?.['minlength']">Le mot de passe doit contenir au moins 8 caractères.</div>
                    </div>
                  </div>
                </div>
                
                <!-- Nouveau mot de passe -->
                <div class="col-lg-6">
                  <div class="form-group">
                    <label for="nouveauMotDePasse" class="form-control-label">Nouveau mot de passe</label>
                    <input
                      type="password"
                      id="nouveauMotDePasse"
                      name="nouveauMotDePasse"
                      class="form-control form-control-alternative"
                      [(ngModel)]="nouveauMotDePasse"
                      required
                      minlength="8"
                      #nouveauMotDePasseInput="ngModel"
                    />
                    <div *ngIf="nouveauMotDePasseInput.invalid && (nouveauMotDePasseInput.dirty || nouveauMotDePasseInput.touched)" style="color:red; font-size:0.85em;">
                      <div *ngIf="nouveauMotDePasseInput.errors?.['required']">Le nouveau mot de passe est requis.</div>
                      <div *ngIf="nouveauMotDePasseInput.errors?.['minlength']">Le mot de passe doit contenir au moins 8 caractères.</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-lg-12 text-right">
                  <button
                    type="submit"
                    class="btn btn-primary"
                    [disabled]="passwordForm.invalid"
                  >
                    Confirmer
                  </button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
