<!-- Bandeau supérieur -->
<div class="header bg-primary py-6 py-lg-5 d-flex align-items-center justify-content-between">
  <div class="container"></div>
  <div class="separator separator-bottom separator-skew zindex-100">
    <svg x="0" y="0" viewBox="0 0 2560 100" preserveAspectRatio="none" version="1.1"
         xmlns="http://www.w3.org/2000/svg">
      <polygon class="fill-default" points="2560 0 2560 100 0 100"></polygon>
    </svg>
  </div>
</div>

<!-- Contenu de la page -->
<div class="container mt--5 pb-1">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="card bg-secondary shadow border-0">
        <div class="card-body px-lg-5 py-lg-2">
          <div class="row justify-content-center">
            <img src="./assets/img/brand/ST2.png" style="max-height: 150px;" class="logo-img" alt="Logo">
          </div>

          <!-- Messages -->
          <div *ngIf="messageErreur" class="alert alert-danger text-center mt-3">
            {{ messageErreur }}
          </div>
          <div *ngIf="messageSuccess" class="alert alert-success text-center mt-3">
            {{ messageSuccess }}
          </div>

          <!-- Formulaire -->
          <form role="form" (ngSubmit)="submitNewPassword()">
            <!-- Nouveau mot de passe -->
            <div class="form-group mb-3">
              <div class="input-group input-group-alternative">
                <div class="input-group-prepend">
                  <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
                </div>
                <input
                  [(ngModel)]="newPassword"
                  name="newPassword"
                  class="form-control"
                  placeholder="Nouveau mot de passe"
                  type="password"
                  required>
              </div>
              <div *ngIf="newPasswordError" style="color:red; font-size:0.85em; margin-top:4px;">
                {{ newPasswordError }}
              </div>
            </div>

            <!-- Confirmation mot de passe -->
            <div class="form-group mb-3">
              <div class="input-group input-group-alternative">
                <div class="input-group-prepend">
                  <span class="input-group-text"><i class="ni ni-lock-circle-open"></i></span>
                </div>
                <input
                  [(ngModel)]="confirmPassword"
                  name="confirmPassword"
                  class="form-control"
                  placeholder="Confirmer le mot de passe"
                  type="password"
                  required>
              </div>
              <div *ngIf="confirmPasswordError" style="color:red; font-size:0.85em; margin-top:4px;">
                {{ confirmPasswordError }}
              </div>
            </div>

            <div class="text-center">
              <button type="submit" class="btn btn-primary my-4">Enregistrer le nouveau mot de passe</button>
            </div>
          </form>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-6">
          <a routerLink="/login" class="text-light"><small>Retour à la connexion</small></a>
        </div>
      </div>
    </div>
  </div>
</div>
