<nav class="navbar navbar-vertical navbar-expand-md navbar-light bg-white"
     id="sidenav-main" [class.minimized]="minimized" [class.mobile-open]="mobileOpen">
  <div class="container-fluid">
    <a class="navbar-brand pt-0" routerLinkActive="active" [routerLink]="['/planning']">
      <img src="./assets/img/brand/ST2.png" class="navbar-brand-img" alt="Sofiatech">
    </a>
    <div class="navbar-collapse" id="sidenav-collapse-main">
      <ul class="navbar-nav">
        <li *ngFor="let menuItem of menuItems" class="{{menuItem.class}} nav-item">
          <a routerLinkActive="active" [routerLink]="[menuItem.path]" class="nav-link"
             (click)="closeMobile()">
            <i class="ni {{menuItem.icon}}"></i>
            <span class="nav-link-text">{{menuItem.title}}</span>
          </a>
        </li>
      </ul>
      <hr class="my-3">
    </div>
