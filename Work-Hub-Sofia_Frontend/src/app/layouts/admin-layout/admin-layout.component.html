<app-sidebar
  [minimized]="isSidebarMinimized"
  [mobileOpen]="isMobileSidebarOpen"
  (onToggleSidebar)="toggleSidebar()"
  (onCloseMobile)="closeMobileSidebar()">
</app-sidebar>

<button class="mobile-menu-button" type="button" (click)="toggleMobileSidebar()"
        aria-label="Ouvrir le menu">
  <i class="fas fa-bars"></i>
</button>
<div class="mobile-sidebar-backdrop" [class.visible]="isMobileSidebarOpen"
     (click)="closeMobileSidebar()"></div>

<!-- Collapse button lives outside sidebar -->
<div class="sidebar-toggler" (click)="toggleSidebar()">
  <i class="fas" [ngClass]="isSidebarMinimized ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
</div>

<div class="main-content" [class.sidebar-minimized]="isSidebarMinimized">
  <app-navbar></app-navbar>
  <router-outlet></router-outlet>
  <div class="container-fluid">
    <app-footer></app-footer>
  </div>
</div>
